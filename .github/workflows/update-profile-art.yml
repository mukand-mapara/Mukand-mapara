name: Update Profile Art

on:
  workflow_dispatch:

  schedule:
    - cron: "17 0 * * *"

permissions:
  contents: write

jobs:
  generate-profile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt
          pip install -r scripts/requirements-portrait.txt

      - name: Prepare profile photo
        run: python scripts/prep_photo.py

      - name: Generate ASCII portrait
        run: python scripts/make_ascii_svg.py

      - name: Generate info card
        run: python scripts/make_info_card.py

      - name: Fetch GitHub contributions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/fetch_contributions.py

      - name: Generate contribution heatmap
        run: python scripts/render_heatmap_svg.py

      - name: Commit generated artwork
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add ascii-portrait.svg
          git add info-card.svg
          git add contrib-heatmap.svg
          git add data/contributions.json

          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            git commit -m "chore: update profile artwork"
            git push
          fi
